name: lms

x-backend: &backend
  build: .
  image: lms-backend:local
  environment: &backend-environment
    APP_DEBUG: "false"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-lms}
    DB_USER: ${DB_USER:-lms}
    DB_PASSWORD: ${DB_PASSWORD:-lms-local}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:-}
    JWT_ISSUER: ${JWT_ISSUER:-lms-api}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-lms-client}
    ACCESS_TOKEN_EXPIRE_SECONDS: ${ACCESS_TOKEN_EXPIRE_SECONDS:-900}
    REFRESH_TOKEN_EXPIRE_SECONDS: ${REFRESH_TOKEN_EXPIRE_SECONDS:-2592000}
    CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
    CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lms}
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
