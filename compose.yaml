name: lms

x-backend: &backend
  build: .
  image: lms-backend:local
  environment: &backend-environment
    APP_DEBUG: "false"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-lms}
    DB_USER: ${DB_USER:-lms}
    DB_PASSWORD: ${DB_PASSWORD:-lms-local}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:-}
    JWT_ISSUER: ${JWT_ISSUER:-lms-api}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-lms-client}
    ACCESS_TOKEN_EXPIRE_SECONDS: ${ACCESS_TOKEN_EXPIRE_SECONDS:-900}
    REFRESH_TOKEN_EXPIRE_SECONDS: ${REFRESH_TOKEN_EXPIRE_SECONDS:-2592000}
    CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
    CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    QUIZ_TIMEZONE: ${QUIZ_TIMEZONE:-Asia/Almaty}
    QUIZ_DAILY_ATTEMPTS: ${QUIZ_DAILY_ATTEMPTS:-5}
    QUIZ_CACHE_SECONDS: ${QUIZ_CACHE_SECONDS:-60}
    QUIZ_STARTS_PER_MINUTE: ${QUIZ_STARTS_PER_MINUTE:-20}
    REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-lms}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lms-local}
    RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-lms.learning.events}
    RABBITMQ_RETRIES: ${RABBITMQ_RETRIES:-5}
    RABBITMQ_TIMEOUT: ${RABBITMQ_TIMEOUT:-5}

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lms-local}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  event-publisher:
    <<: *backend
    command: ["python", "-m", "src.learning_events.worker", "publisher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  notification-worker:
    <<: *backend
    command: ["python", "-m", "src.learning_events.worker", "consumer"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-lms}
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms-local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
